<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>🔒 Fotoo Secure Slideshow</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans KR', sans-serif; }
    body {
      background: #090d16;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }
    .bg-glow {
      position: absolute;
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(14,165,233,0.18) 0%, rgba(99,102,241,0.08) 50%, transparent 70%);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      filter: blur(40px);
      z-index: 0;
      pointer-events: none;
    }
    .lock-card {
      position: relative;
      z-index: 10;
      background: rgba(15, 23, 42, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 24px;
      padding: 36px 28px;
      width: 90%;
      max-width: 420px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), 0 0 30px rgba(14, 165, 233, 0.1);
      text-align: center;
      animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px) scale(0.96); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    .lock-icon {
      width: 68px;
      height: 68px;
      margin: 0 auto 18px;
      background: linear-gradient(135deg, rgba(14, 165, 233, 0.2), rgba(99, 102, 241, 0.2));
      border: 1px solid rgba(56, 189, 248, 0.4);
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      box-shadow: 0 8px 24px rgba(14, 165, 233, 0.2);
    }
    h1 { font-size: 1.35rem; font-weight: 700; margin-bottom: 8px; color: #fff; letter-spacing: -0.5px; }
    p.desc { font-size: 0.88rem; color: #94a3b8; line-height: 1.5; margin-bottom: 24px; word-break: keep-all; }
    .input-box {
      position: relative;
      margin-bottom: 16px;
    }
    input[type="text"], input[type="password"] {
      width: 100%;
      padding: 14px 16px;
      background: rgba(30, 41, 59, 0.7);
      border: 1.5px solid rgba(255, 255, 255, 0.15);
      border-radius: 14px;
      color: #fff;
      font-size: 0.95rem;
      outline: none;
      transition: all 0.2s ease;
      text-align: center;
      letter-spacing: 1px;
    }
    input:focus {
      border-color: #38bdf8;
      background: rgba(30, 41, 59, 0.95);
      box-shadow: 0 0 20px rgba(56, 189, 248, 0.25);
    }
    .btn-unlock {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #0284c7 0%, #2563eb 100%);
      color: #fff;
      border: none;
      border-radius: 14px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 8px 20px rgba(2, 132, 199, 0.35);
    }
    .btn-unlock:hover { transform: translateY(-2px); box-shadow: 0 12px 25px rgba(2, 132, 199, 0.5); }
    .btn-unlock:active { transform: scale(0.98); }
    .error-msg {
      color: #f87171;
      font-size: 0.82rem;
      margin-top: 12px;
      display: none;
      animation: shake 0.35s ease;
    }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-6px); }
      40%, 80% { transform: translateX(6px); }
    }
    .status-msg {
      color: #38bdf8;
      font-size: 0.85rem;
      margin-top: 12px;
      display: none;
    }
  </style>
</head>

  async function decryptData(passKey) {
    const enc = new TextEncoder();
    const rawKey = enc.encode(passKey.trim());
    const keyMaterial = await crypto.subtle.importKey(
      'raw', rawKey, { name: 'PBKDF2' }, false, ['deriveKey']
    );
    const salt = Uint8Array.from(atob(ENCRYPTED_DATA.salt), c => c.charCodeAt(0));
    const iv = Uint8Array.from(atob(ENCRYPTED_DATA.iv), c => c.charCodeAt(0));
    const ciphertext = Uint8Array.from(atob(ENCRYPTED_DATA.ciphertext), c => c.charCodeAt(0));

    const aesKey = await crypto.subtle.deriveKey(
      { name: 'PBKDF2', salt: salt, iterations: 100000, hash: 'SHA-256' },
      keyMaterial,
      { name: 'AES-GCM', length: 256 },
      false,
      ['decrypt']
    );

    const decrypted = await crypto.subtle.decrypt(
      { name: 'AES-GCM', iv: iv },
      aesKey,
      ciphertext
    );
    const dec = new TextDecoder();
    return dec.decode(decrypted);
  }

  function launchSlideshow(htmlContent) {
    document.open();
    document.write(htmlContent);
    document.close();
  }

  async function tryAutoUnlock() {
    const hash = window.location.hash || '';
    let key = '';
    const m = hash.match(/(?:#|&|\?)key=([^&]+)/i);
    if (m) {
      key = decodeURIComponent(m[1]);
    } else if (hash.startsWith('#') && hash.length > 3 && !hash.includes('=')) {
      key = decodeURIComponent(hash.substring(1));
    }

    if (key) {
      const statusEl = document.getElementById('status-msg');
      if (statusEl) {
        statusEl.style.display = 'block';
        statusEl.textContent = '⚡ 슬라이드쇼 자동 복호화 중...';
      }
      try {
        const html = await decryptData(key);
        launchSlideshow(html);
        return;
      } catch (err) {
        console.warn('Auto unlock failed:', err);
        if (statusEl) statusEl.style.display = 'none';
        showError('❌ URL의 보안 키가 올바르지 않습니다.');
      }
    }
  }

  function showError(msg) {
    const errEl = document.getElementById('error-msg');
    const card = document.getElementById('lock-card');
    if (errEl) {
      errEl.textContent = msg || '❌ 보안 키가 올바르지 않습니다.';
      errEl.style.display = 'block';
    }
    if (card) {
      card.style.animation = 'none';
      void card.offsetWidth;
      card.style.animation = 'shake 0.35s ease';
    }
  }

  async function handleUnlock() {
    const input = document.getElementById('key-input');
    const key = input ? input.value.trim() : '';
    if (!key) {
      showError('⚠️ 보안 키를 입력해주세요.');
      if (input) input.focus();
      return;
    }
    const statusEl = document.getElementById('status-msg');
    const btn = document.getElementById('btn-unlock');
    const errEl = document.getElementById('error-msg');
    if (errEl) errEl.style.display = 'none';
    if (statusEl) {
      statusEl.style.display = 'block';
      statusEl.textContent = '⏳ 복호화 검증 중...';
    }
    if (btn) btn.disabled = true;

    try {
      const html = await decryptData(key);
      window.location.hash = '#key=' + encodeURIComponent(key);
      launchSlideshow(html);
    } catch (err) {
      if (statusEl) statusEl.style.display = 'none';
      if (btn) btn.disabled = false;
      showError('❌ 보안 키가 일치하지 않습니다.');
      if (input) {
        input.focus();
        input.select();
      }
    }
  }

  document.getElementById('key-input').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') handleUnlock();
  });

  tryAutoUnlock();
</script>
