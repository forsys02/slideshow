<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>only.jeonla · 2015년 4월 25일~2026년 8월 12일 📸 - Fotoo 슬라이드쇼</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    body, html {
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background: #000;
      font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Segoe UI", Roboto, sans-serif;
      color: #fff;
    }
    
    #fotoo-viewer {
      position: relative;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      background: #000;
    }
    
    /* 듀얼 레이어 */
    .fotoo-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      transition: opacity 1.5s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      will-change: transform, opacity;
      perspective: 1200px;
    }
    .fotoo-layer.active { opacity: 1; pointer-events: auto; }
    
    /* 엠비언트 블러 배경 */
    .fotoo-backdrop {
      position: absolute;
      top: -12%;
      left: -12%;
      width: 124%;
      height: 124%;
      background-size: cover;
      background-position: center;
      filter: blur(45px) brightness(0.35) saturate(1.3);
      transform: scale(1.1);
      z-index: 1;
      opacity: 0;
      transition: opacity 1.5s ease;
    }
    .fotoo-backdrop.active { opacity: 1; }
    
    /* 메인 전면 이미지 */
    .fotoo-img {
      position: relative;
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      z-index: 2;
      box-shadow: 0 15px 50px rgba(0,0,0,0.9);
      transform-origin: center center;
      transition: filter 0.5s ease;
    }
    
    /* 뷰 모드 */
    #fotoo-viewer.view-cover .fotoo-img { width: 100%; height: 100%; object-fit: cover; }
    #fotoo-viewer.view-cover .fotoo-backdrop { display: none; }

    /* 🎨 비주얼 감성 필터 */
    #fotoo-viewer.filter-film .fotoo-img { filter: sepia(0.2) contrast(1.1) brightness(0.95) saturate(0.9); }
    #fotoo-viewer.filter-warm .fotoo-img { filter: sepia(0.35) saturate(1.3) hue-rotate(-15deg); }
    #fotoo-viewer.filter-cool .fotoo-img { filter: saturate(1.1) hue-rotate(15deg) contrast(1.05); }
    #fotoo-viewer.filter-mono .fotoo-img { filter: grayscale(1) contrast(1.2) brightness(0.95); }
    #fotoo-viewer.filter-vivid .fotoo-img { filter: saturate(1.4) contrast(1.15); }
    
    /* 🎬 모션 / 켄 번즈 애니메이션 */
    :root { --kb-duration: 8s; }
    .kb-zoom-in .fotoo-img { animation: kbZoomIn var(--kb-duration) cubic-bezier(0.25, 1, 0.5, 1) forwards; }
    .kb-zoom-out .fotoo-img { animation: kbZoomOut var(--kb-duration) cubic-bezier(0.25, 1, 0.5, 1) forwards; }
    .kb-pan-left .fotoo-img { animation: kbPanLeft var(--kb-duration) cubic-bezier(0.25, 1, 0.5, 1) forwards; }
    .kb-pan-right .fotoo-img { animation: kbPanRight var(--kb-duration) cubic-bezier(0.25, 1, 0.5, 1) forwards; }
    .kb-zoom-fade .fotoo-img { animation: kbZoomFade var(--kb-duration) ease-out forwards; }
    .kb-flip-3d .fotoo-img { animation: kbFlip3d var(--kb-duration) ease-out forwards; }
    .kb-slide .fotoo-img { animation: kbSlide var(--kb-duration) cubic-bezier(0.2, 0.8, 0.2, 1) forwards; }
    .kb-vortex .fotoo-img { animation: kbVortex var(--kb-duration) ease-out forwards; }
    
    @keyframes kbZoomIn { 0% { transform: scale(1); } 100% { transform: scale(1.12); } }
    @keyframes kbZoomOut { 0% { transform: scale(1.12); } 100% { transform: scale(1); } }
    @keyframes kbPanLeft { 0% { transform: scale(1.08) translateX(3%); } 100% { transform: scale(1.08) translateX(-3%); } }
    @keyframes kbPanRight { 0% { transform: scale(1.08) translateX(-3%); } 100% { transform: scale(1.08) translateX(3%); } }
    @keyframes kbZoomFade { 0% { transform: scale(1.02); } 100% { transform: scale(1.08); } }
    @keyframes kbFlip3d { 0% { transform: perspective(1000px) rotateY(-8deg) scale(0.96); } 100% { transform: perspective(1000px) rotateY(0deg) scale(1.05); } }
    @keyframes kbSlide { 0% { transform: translateX(4%) scale(1.03); } 100% { transform: translateX(-2%) scale(1.06); } }
    @keyframes kbVortex { 0% { transform: scale(1) rotate(-1.5deg); } 100% { transform: scale(1.1) rotate(1.5deg); } }

    /* ⏱️ 하단 하트비트 프로그레스 바 */
    #fotoo-progress-container {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 3px;
      background: rgba(255, 255, 255, 0.08);
      z-index: 120;
      opacity: 1;
      transition: opacity 0.5s ease;
      pointer-events: none;
    }
    #fotoo-viewer.idle #fotoo-progress-container { opacity: 0.28; }
    #fotoo-progress-bar {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #38bdf8, #818cf8, #c084fc, #f472b6);
      transition: width 0.1s linear;
    }
    
    /* UI 오버레이 */
    .fotoo-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 50;
      opacity: 1;
      transition: opacity 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }
    #fotoo-viewer.idle .fotoo-overlay { opacity: 0; pointer-events: none; }
    
    /* 상단 헤더 */
    .fotoo-header {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      padding: env(safe-area-inset-top, 16px) 20px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: linear-gradient(to bottom, rgba(0,0,0,0.8) 0%, rgba(0,0,0,0) 100%);
      pointer-events: auto;
    }
    .fotoo-badge-group { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .fotoo-pill {
      font-size: 0.92rem;
      font-weight: 600;
      background: rgba(255,255,255,0.14);
      padding: 6px 14px;
      border-radius: 20px;
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.18);
      display: flex;
      align-items: center;
      gap: 6px;
      text-shadow: 0 2px 4px rgba(0,0,0,0.8);
      max-width: 60vw;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .fotoo-counter {
      font-size: 0.86rem;
      font-weight: 500;
      color: rgba(255,255,255,0.9);
      background: rgba(0,0,0,0.45);
      padding: 5px 12px;
      border-radius: 16px;
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.15);
    }

    /* 🕒 엠비언트 시계 */
    #fotoo-ambient-clock {
      position: absolute;
      bottom: calc(env(safe-area-inset-bottom, 0px) + 20px);
      right: 20px;
      background: rgba(15, 23, 42, 0.7);
      padding: 10px 16px;
      border-radius: 18px;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.18);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.65);
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      cursor: grab;
      pointer-events: auto;
      z-index: 90;
      transition: opacity 0.4s ease, box-shadow 0.2s ease;
      touch-action: none;
    }
    #fotoo-ambient-clock:active { cursor: grabbing; box-shadow: 0 14px 40px rgba(56, 189, 248, 0.45); }
    .fotoo-amb-clock-main { display: flex; align-items: baseline; gap: 2px; line-height: 1; }
    .fotoo-amb-time {
      font-size: 2.1rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: #ffffff;
      font-variant-numeric: tabular-nums;
      text-shadow: 0 2px 8px rgba(0,0,0,0.6);
    }
    .fotoo-amb-sec { font-size: 1.05rem; font-weight: 700; color: #38bdf8; margin-left: 3px; font-variant-numeric: tabular-nums; }
    .fotoo-amb-date {
      font-size: 0.78rem;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.75);
      margin-top: 4px;
      text-align: right;
      letter-spacing: -0.2px;
    }

    /* 하단 메뉴 바 */
    .fotoo-bottom-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 14px 16px calc(env(safe-area-inset-bottom, 12px) + 14px);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      background: linear-gradient(to top, rgba(0,0,0,0.88) 0%, rgba(0,0,0,0) 100%);
      pointer-events: auto;
    }

    .fotoo-filmstrip {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      max-width: 96vw;
      padding: 4px 2px;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
    }
    .fotoo-filmstrip::-webkit-scrollbar { display: none; }
    .filmstrip-thumb {
      width: 44px;
      height: 32px;
      border-radius: 6px;
      object-fit: cover;
      opacity: 0.5;
      cursor: pointer;
      border: 2px solid transparent;
      transition: all 0.2s ease;
      flex-shrink: 0;
    }
    .filmstrip-thumb:hover { opacity: 0.9; transform: scale(1.08); }
    .filmstrip-thumb.active {
      opacity: 1;
      border-color: #38bdf8;
      transform: scale(1.12);
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.8);
    }

    .fotoo-controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      flex-wrap: wrap;
      max-width: 100vw;
    }
    .f-btn {
      background: rgba(255,255,255,0.12);
      border: 1px solid rgba(255,255,255,0.22);
      color: #fff;
      padding: 7px 13px;
      border-radius: 18px;
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
      backdrop-filter: blur(12px);
      transition: all 0.2s cubic-bezier(0.2, 0.8, 0.2, 1);
      white-space: nowrap;
    }
    .f-btn:hover { background: rgba(255,255,255,0.25); transform: translateY(-2px); }
    .f-btn:active { transform: scale(0.95); }
    .f-btn.active {
      background: #0284c7;
      border-color: #38bdf8;
      box-shadow: 0 0 16px rgba(56, 189, 248, 0.6);
    }

    .nav-arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 54px;
      height: 90px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.2rem;
      color: rgba(255,255,255,0.4);
      cursor: pointer;
      pointer-events: auto;
      transition: all 0.2s ease;
      z-index: 60;
      border-radius: 10px;
    }
    .nav-arrow:hover { color: #fff; background: rgba(255,255,255,0.12); transform: translateY(-50%) scale(1.1); }
    .nav-prev { left: 10px; }
    .nav-next { right: 10px; }

    /* 모바일 반응형 */
    @media (max-width: 768px) {
      .fotoo-header { padding: calc(env(safe-area-inset-top, 0px) + 12px) 14px 10px; }
      .fotoo-pill { font-size: 0.82rem; padding: 5px 10px; max-width: 55vw; }
      .fotoo-counter { font-size: 0.78rem; padding: 4px 8px; }

      #fotoo-ambient-clock {
        bottom: calc(env(safe-area-inset-bottom, 0px) + 16px);
        right: 14px;
        padding: 6px 12px;
        border-radius: 14px;
      }
      .fotoo-amb-time { font-size: 1.55rem; }
      .fotoo-amb-sec { font-size: 0.82rem; }
      .fotoo-amb-date { font-size: 0.68rem; }

      .fotoo-bottom-bar {
        padding: 8px 10px calc(env(safe-area-inset-bottom, 0px) + 10px);
        gap: 8px;
      }
      .fotoo-filmstrip { max-width: 98vw; gap: 4px; }
      .filmstrip-thumb { width: 38px; height: 28px; }
      
      .fotoo-controls {
        display: flex;
        flex-wrap: nowrap;
        overflow-x: auto;
        justify-content: flex-start;
        width: 100vw;
        padding: 2px 10px 4px;
        scrollbar-width: none;
        -webkit-overflow-scrolling: touch;
      }
      .fotoo-controls::-webkit-scrollbar { display: none; }
      .f-btn {
        padding: 6px 11px;
        font-size: 0.78rem;
        flex-shrink: 0;
      }
      .nav-arrow { width: 44px; height: 70px; font-size: 1.8rem; }
      .nav-prev { left: 4px; }
      .nav-next { right: 4px; }
    }
  </style>
</head>
<body>

<!-- 🎵 우리 서버 자체 호스팅 100% 무중단 BGM 오디오 플레이어 -->
<audio id="fotoo-bgm" loop preload="none"></audio>

<div id="fotoo-viewer">

  <!-- 🕒 엠비언트 시계 위젯 -->
  <div id="fotoo-ambient-clock" title="드래그하여 위치 이동 (더블탭/더블클릭 시 초기화)">

  <!-- ⏱️ 하단 하트비트 프로그레스 바 -->
  <div id="fotoo-progress-container"><div id="fotoo-progress-bar"></div></div>

  <!-- UI 오버레이 -->
  <div class="fotoo-overlay">
    <div class="fotoo-header">
      <div class="fotoo-badge-group">
        <div class="fotoo-pill" id="album-title-el">🖼️ only.jeonla · 2015년 4월 25일~2026년 8월 12일 📸</div>

        <button class="f-btn" id="btn-next">다음 ⏭</button>
        <button class="f-btn active" id="btn-shuffle">🔀 셔플 ON</button>
        <button class="f-btn" id="btn-motion">🎬 KenBurns</button>
        <button class="f-btn" id="btn-filter">🎨 원본</button>
        <button class="f-btn" id="btn-view">📐 맞춤</button>
        <button class="f-btn" id="btn-interval">⏱️ 6초</button>
        <button class="f-btn" id="btn-bgm" title="클릭할 때마다 감성 테마곡 순환 변경 (단축키 B)">🔇 BGM OFF</button>
        <button class="f-btn" id="btn-fullscreen">⛶ 풀화면</button>
      </div>
    </div>
  </div>
</div>

  function updateClock() {
    const now = new Date();
    const h = String(now.getHours()).padStart(2,'0');
    const m = String(now.getMinutes()).padStart(2,'0');
    const s = String(now.getSeconds()).padStart(2,'0');
    
    document.getElementById('fotoo-amb-time').textContent = `${h}:${m}`;
    document.getElementById('fotoo-amb-sec').textContent = s;
    
    const days = ['일', '월', '화', '수', '목', '금', '토'];
    document.getElementById('fotoo-amb-date').textContent = `${now.getFullYear()}.${String(now.getMonth()+1).padStart(2,'0')}.${String(now.getDate()).padStart(2,'0')} (${days[now.getDay()]})`;
  }
  setInterval(updateClock, 1000);
  updateClock();

  // 🕒 시계 드래그
  const clockEl = document.getElementById('fotoo-ambient-clock');
  let isDragging = false, dragStartX = 0, dragStartY = 0, clockInitLeft = 0, clockInitTop = 0, moved = false;
  function restoreClockPos() {
    try {
      const saved = localStorage.getItem('fotoo_clock_pos');
      if (saved) {
        const pos = JSON.parse(saved);
        if (pos.left !== undefined && pos.top !== undefined) {
          clockEl.style.left = `${pos.left}px`;
          clockEl.style.top = `${pos.top}px`;
          clockEl.style.right = 'auto';
          clockEl.style.bottom = 'auto';
        }
      }
    } catch(e) {}
  }
  restoreClockPos();

  clockEl.addEventListener('pointerdown', (e) => {
    if (e.button !== undefined && e.button !== 0) return;
    isDragging = true;
    moved = false;
    dragStartX = e.clientX; dragStartY = e.clientY;
    const rect = clockEl.getBoundingClientRect();
    clockInitLeft = rect.left; clockInitTop = rect.top;
    try { clockEl.setPointerCapture(e.pointerId); } catch(err) {}
  });

  window.addEventListener('pointermove', (e) => {
    if (!isDragging) return;
    const dx = e.clientX - dragStartX;
    const dy = e.clientY - dragStartY;
    if (Math.hypot(dx, dy) > 4) moved = true;

    const pad = 10;
    const maxLeft = window.innerWidth - clockEl.offsetWidth - pad;
    const maxTop = window.innerHeight - clockEl.offsetHeight - pad;

    let newLeft = Math.max(pad, Math.min(clockInitLeft + dx, maxLeft));
    let newTop = Math.max(pad, Math.min(clockInitTop + dy, maxTop));

    clockEl.style.left = `${Math.round(newLeft)}px`;
    clockEl.style.top = `${Math.round(newTop)}px`;
    clockEl.style.right = 'auto';
    clockEl.style.bottom = 'auto';
  });

  window.addEventListener('pointerup', (e) => {
    if (!isDragging) return;
    isDragging = false;
    try { clockEl.releasePointerCapture(e.pointerId); } catch(err) {}
    if (moved) {
      const rect = clockEl.getBoundingClientRect();
      localStorage.setItem('fotoo_clock_pos', JSON.stringify({
        left: Math.round(rect.left),
        top: Math.round(rect.top)
      }));
    }
  });

  clockEl.addEventListener('dblclick', (e) => {
    e.stopPropagation();
    localStorage.removeItem('fotoo_clock_pos');
    clockEl.style.left = '';
    clockEl.style.top = '';
    clockEl.style.right = '20px';
    clockEl.style.bottom = '20px';
  });

  function getFullImageUrl(url) {
    if (!url) return '';
    return url.includes('googleusercontent.com') ? `${url}=w2048-h1152-no` : url;
  }
  function getThumbUrl(url) {
    if (!url) return '';
    return url.includes('googleusercontent.com') ? `${url}=w160-h120-c` : url;
  }

  function doShuffle() {
    for (let i = photos.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [photos[i], photos[j]] = [photos[j], photos[i]];
    }
  }

  function updateFilmstrip() {
    filmstrip.innerHTML = '';
    const range = 5;
    for (let i = -range; i <= range; i++) {
      let idx = (currentIndex + i + photos.length) % photos.length;
      const img = document.createElement('img');
      img.className = 'filmstrip-thumb' + (i === 0 ? ' active' : '');
      img.src = getThumbUrl(photos[idx]);
      img.onclick = (e) => { e.stopPropagation(); showSlide(idx); };
      filmstrip.appendChild(img);
    }
  }

  function showSlide(index) {
    if (!photos.length) return;
    if (index < 0) index = photos.length - 1;
    if (index >= photos.length) index = 0;
    currentIndex = index;

    const nextLayerId = activeLayer === 'a' ? 'b' : 'a';
    const prevLayerId = activeLayer;
    activeLayer = nextLayerId;

    const nextLayer = document.getElementById(`fotoo-layer-${nextLayerId}`);
    const nextImg = document.getElementById(`fotoo-img-${nextLayerId}`);
    const nextBackdrop = document.getElementById(`fotoo-backdrop-${nextLayerId}`);
    const prevLayer = document.getElementById(`fotoo-layer-${prevLayerId}`);
    const prevBackdrop = document.getElementById(`fotoo-backdrop-${prevLayerId}`);

    const fullUrl = getFullImageUrl(photos[currentIndex]);

    const preloader = new Image();
    preloader.onload = () => {
      nextImg.src = fullUrl;
      nextBackdrop.style.backgroundImage = `url("${fullUrl}")`;

      const curMotion = MOTIONS[motionIdx];
      let animClass = '';
      if (curMotion === 'kenburns') {
        let eIdx;
        do { eIdx = Math.floor(Math.random() * KB_EFFECTS.length); } while (eIdx === lastEffectIdx && KB_EFFECTS.length > 1);
        lastEffectIdx = eIdx;
        animClass = KB_EFFECTS[eIdx];
      } else if (curMotion === 'flip3d') animClass = 'kb-flip-3d';
      else if (curMotion === 'slide') animClass = 'kb-slide';
      else if (curMotion === 'vortex') animClass = 'kb-vortex';
      else if (curMotion === 'zoomfade') animClass = 'kb-zoom-fade';
      else if (curMotion === 'random') {
        const all = [...KB_EFFECTS, 'kb-flip-3d', 'kb-slide', 'kb-vortex'];
        animClass = all[Math.floor(Math.random() * all.length)];
      }

      nextLayer.className = `fotoo-layer ${animClass} active`;
      nextBackdrop.classList.add('active');

      if (prevLayer) prevLayer.classList.remove('active');
      if (prevBackdrop) prevBackdrop.classList.remove('active');

      counterEl.textContent = `${(currentIndex + 1).toLocaleString()} / ${photos.length.toLocaleString()}`;
      updateFilmstrip();
      preloadNext();
      if (isPlaying) startTimer();
    };
    preloader.onerror = () => { setTimeout(() => nextSlide(), 500); };
    preloader.src = fullUrl;
  }

  function preloadNext() {
    const nextIdx = (currentIndex + 1) % photos.length;
    const nextImg = new Image();
    nextImg.src = getFullImageUrl(photos[nextIdx]);
  }

  function startTimer() {
    clearTimeout(slideTimer);
    cancelAnimationFrame(progressAnim);
    progressStart = performance.now();
    const duration = intervalSec * 1000;

    function step(now) {
      const elapsed = now - progressStart;
      const pct = Math.min(100, (elapsed / duration) * 100);
      progressBar.style.width = `${pct}%`;
      if (elapsed < duration) {
        progressAnim = requestAnimationFrame(step);
      } else {
        progressBar.style.width = '0%';
        nextSlide();
      }
    }
    progressAnim = requestAnimationFrame(step);
  }

  function stopTimer() {
    clearTimeout(slideTimer);
    cancelAnimationFrame(progressAnim);
    progressBar.style.width = '0%';
  }

  function nextSlide() { showSlide(currentIndex + 1); }
  function prevSlide() { showSlide(currentIndex - 1); }

  function togglePlay() {
    isPlaying = !isPlaying;
    btnPlay.innerHTML = isPlaying ? '⏸ 정지' : '▶ 재생';
    btnPlay.classList.toggle('active', !isPlaying);
    if (isPlaying) startTimer(); else stopTimer();
  }

  function toggleShuffle() {
    isShuffle = !isShuffle;
    btnShuffle.classList.toggle('active', isShuffle);
    btnShuffle.textContent = isShuffle ? '🔀 셔플 ON' : '➡️ 순차';
    const curPhoto = photos[currentIndex];
    if (isShuffle) doShuffle(); else photos = [...originalPhotos];
    const newIdx = photos.indexOf(curPhoto);
    currentIndex = newIdx !== -1 ? newIdx : 0;
    counterEl.textContent = `${(currentIndex + 1).toLocaleString()} / ${photos.length.toLocaleString()}`;
    updateFilmstrip();
  }

  function cycleMotion() {
    motionIdx = (motionIdx + 1) % MOTIONS.length;
    btnMotion.textContent = MOTION_NAMES[MOTIONS[motionIdx]];
    showSlide(currentIndex);
  }

  function cycleFilter() {
    FILTERS.forEach(f => viewer.classList.remove(`filter-${f}`));
    filterIdx = (filterIdx + 1) % FILTERS.length;
    const curF = FILTERS[filterIdx];
    if (curF !== 'normal') viewer.classList.add(`filter-${curF}`);
    btnFilter.textContent = FILTER_NAMES[curF];
  }

  function toggleViewMode() {
    isCoverView = !isCoverView;
    viewer.classList.toggle('view-cover', isCoverView);
    btnView.textContent = isCoverView ? '🖼️ 채우기' : '📐 맞춤';
  }

  function changeInterval() {
    const intervals = [3, 5, 6, 8, 12, 20, 30];
    intervalSec = intervals[(intervals.indexOf(intervalSec) + 1) % intervals.length];
    btnInterval.textContent = `⏱️ ${intervalSec}초`;
    document.documentElement.style.setProperty('--kb-duration', `${intervalSec + 2}s`);
    if (isPlaying) startTimer();
  }

  // 🎵 [100% 소리 보장 자체 호스팅 BGM 순환 함수]
  function cycleBgm() {
    bgmIdx = (bgmIdx + 1) % BGM_PLAYLIST.length;
    const curTheme = BGM_PLAYLIST[bgmIdx];
    
    btnBgm.textContent = curTheme.name;
    btnBgm.classList.toggle('active', bgmIdx !== 0);

    if (curTheme.url) {
      bgmAudio.src = curTheme.url;
      bgmAudio.currentTime = 0;
      const playPromise = bgmAudio.play();
      if (playPromise !== undefined) {
        playPromise.catch(err => {
          console.warn('[Fotoo BGM] play error:', err);
        });
      }
    } else {
      bgmAudio.pause();
    }
  }

  function toggleFullscreen() {
    if (!document.fullscreenElement) {
      document.documentElement.requestFullscreen().catch(() => {});
      btnFullscreen.innerHTML = '🗗 창모드';
    } else {
      if (document.exitFullscreen) document.exitFullscreen();
      btnFullscreen.innerHTML = '⛶ 풀화면';
    }
  }

  function resetIdle() {
    viewer.classList.remove('idle');
    clearTimeout(idleTimer);
    const isTouch = window.matchMedia('(pointer: coarse)').matches || ('ontouchstart' in window);
    idleTimer = setTimeout(() => {
      if (isPlaying) viewer.classList.add('idle');
    }, isTouch ? 4500 : 3000);
  }
  window.addEventListener('mousemove', resetIdle);
  resetIdle();

  // 모바일 터치 제스처
  let touchStartX = 0, touchStartY = 0, touchStartTime = 0, lastTapTime = 0, singleTapTimer = null;
  viewer.addEventListener('touchstart', (e) => {
    if (e.target.closest('button, .fotoo-controls, .filmstrip-thumb, #fotoo-ambient-clock, .fotoo-header')) {
      resetIdle();
      return;
    }
    if (e.touches && e.touches.length) {
      touchStartX = e.touches[0].clientX;
      touchStartY = e.touches[0].clientY;
      touchStartTime = Date.now();
    }
  }, { passive: true });

  viewer.addEventListener('touchend', (e) => {
    if (e.target.closest('button, .fotoo-controls, .filmstrip-thumb, #fotoo-ambient-clock, .fotoo-header')) return;
    if (!e.changedTouches || !e.changedTouches.length) return;

    const dx = e.changedTouches[0].clientX - touchStartX;
    const dy = e.changedTouches[0].clientY - touchStartY;
    const dist = Math.hypot(dx, dy);
    const duration = Date.now() - touchStartTime;

    if (dist > 40 && Math.abs(dx) > Math.abs(dy) * 1.3) {
      clearTimeout(singleTapTimer);
      if (dx < 0) nextSlide();
      else prevSlide();
      resetIdle();
      return;
    }

    if (dist < 15 && duration < 350) {
      const now = Date.now();
      if (now - lastTapTime < 280) {
        clearTimeout(singleTapTimer);
        singleTapTimer = null;
        lastTapTime = 0;
        togglePlay();
        resetIdle();
      } else {
        lastTapTime = now;
        singleTapTimer = setTimeout(() => {
          singleTapTimer = null;
          if (viewer.classList.contains('idle')) {
            viewer.classList.remove('idle');
            resetIdle();
          } else {
            viewer.classList.add('idle');
          }
        }, 260);
      }
    }
  }, { passive: true });

  // 버튼 이벤트
  document.getElementById('btn-prev').addEventListener('click', (e) => { e.stopPropagation(); prevSlide(); });
  document.getElementById('btn-next').addEventListener('click', (e) => { e.stopPropagation(); nextSlide(); });
  document.getElementById('btn-prev-arrow').addEventListener('click', (e) => { e.stopPropagation(); prevSlide(); });
  document.getElementById('btn-next-arrow').addEventListener('click', (e) => { e.stopPropagation(); nextSlide(); });
  btnPlay.addEventListener('click', (e) => { e.stopPropagation(); togglePlay(); });
  btnShuffle.addEventListener('click', (e) => { e.stopPropagation(); toggleShuffle(); });
  btnMotion.addEventListener('click', (e) => { e.stopPropagation(); cycleMotion(); });
  btnFilter.addEventListener('click', (e) => { e.stopPropagation(); cycleFilter(); });
  btnView.addEventListener('click', (e) => { e.stopPropagation(); toggleViewMode(); });
  btnInterval.addEventListener('click', (e) => { e.stopPropagation(); changeInterval(); });
  btnBgm.addEventListener('click', (e) => { e.stopPropagation(); cycleBgm(); });
  btnFullscreen.addEventListener('click', (e) => { e.stopPropagation(); toggleFullscreen(); });

  // 키보드 단축키
  window.addEventListener('keydown', (e) => {
    resetIdle();
    if (e.key === 'ArrowRight' || e.key === 'PageDown' || e.key === 'j') nextSlide();
    else if (e.key === 'ArrowLeft' || e.key === 'PageUp' || e.key === 'k') prevSlide();
    else if (e.key === ' ' || e.key === 'k') { e.preventDefault(); togglePlay(); }
    else if (e.key === 'f' || e.key === 'F') toggleFullscreen();
    else if (e.key === 's' || e.key === 'S') toggleShuffle();
    else if (e.key === 'm' || e.key === 'M') cycleMotion();
    else if (e.key === 'b' || e.key === 'B') cycleBgm();
  });

  try {
    if ('wakeLock' in navigator) {
      navigator.wakeLock.request('screen').catch(()=>{});
    }
  } catch(e) {}

  doShuffle();
  showSlide(0);
</script>

</body>
</html>
